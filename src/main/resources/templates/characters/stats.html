<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estadísticas de Personajes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-inverse">
    <div class="container">
        <a class="navbar-brand" href="/">Rick & Morty</a>
        <ul class="nav navbar-nav">
            <li class="active"><a href="/characters">Characters</a></li>
            <li><a href="/episodes">Episodes</a></li>
            <li><a href="/locations">Locations</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <h1>Estadísticas de Personajes</h1>
    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>Personaje</th>
            <th>Ubicación</th>
            <th>Nº de Episodios</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${stats}">
            <td th:text="${s.characterName}"></td>
            <td th:text="${s.locationName != null ? s.locationName : 'Desconocida'}"></td>
            <td th:text="${s.episodeCount}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
