<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Character Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-inverse">
    <div class="container">
        <a class="navbar-brand" href="/">Rick & Morty</a>
        <ul class="nav navbar-nav">
            <li><a href="/characters">Characters</a></li>
            <li><a href="/episodes">Episodes</a></li>
            <li><a href="/locations">Locations</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <h1 th:text="${pageTitle}">Character Form</h1>

    <form th:action="@{${formAction}}" th:object="${characterDTO}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
            <label for="name">Name</label>
            <input id="name" type="text" class="form-control" th:field="*{name}"/>
            <span class="help-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-group" th:classappend="${#fields.hasErrors('status')} ? 'has-error'">
            <label for="status">Status</label>
            <input id="status" type="text" class="form-control" th:field="*{status}"/>
            <span class="help-block" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
        </div>

        <div class="form-group" th:classappend="${#fields.hasErrors('species')} ? 'has-error'">
            <label for="species">Species</label>
            <input id="species" type="text" class="form-control" th:field="*{species}"/>
            <span class="help-block" th:if="${#fields.hasErrors('species')}" th:errors="*{species}"></span>
        </div>

        <div class="form-group" th:classappend="${#fields.hasErrors('type')} ? 'has-error'">
            <label for="type">Type</label>
            <input id="type" type="text" class="form-control" th:field="*{type}"/>
            <span class="help-block" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></span>
        </div>

        <div class="form-group" th:classappend="${#fields.hasErrors('gender')} ? 'has-error'">
            <label for="gender">Gender</label>
            <select id="gender" class="form-control" th:field="*{gender}">
                <option value="">-- Selecciona un género --</option>
                <option th:each="g : ${genders}" th:value="${g.name()}" th:text="${g.name()}"></option>
            </select>
            <span class="help-block" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
        </div>

        <div class="form-group" th:classappend="${#fields.hasErrors('weight')} ? 'has-error'">
            <label for="weight">Weight</label>
            <input id="weight" type="number" step="any" class="form-control" th:field="*{weight}"/>
            <span class="help-block" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}"></span>
        </div>

        <div class="form-group" th:classappend="${#fields.hasErrors('height')} ? 'has-error'">
            <label for="height">Height</label>
            <input id="height" type="number" step="any" class="form-control" th:field="*{height}"/>
            <span class="help-block" th:if="${#fields.hasErrors('height')}" th:errors="*{height}"></span>
        </div>

        <div class="form-group" th:classappend="${#fields.hasErrors('locationId')} ? 'has-error'">
            <label for="locationId">Location</label>
            <select id="locationId" class="form-control" th:field="*{locationId}">
                <option value="">-- Selecciona una localización --</option>
                <option th:each="loc : ${locations}" th:value="${loc.id}" th:text="${loc.name}"></option>
            </select>
            <span class="help-block" th:if="${#fields.hasErrors('locationId')}" th:errors="*{locationId}"></span>
        </div>

        <div class="form-group" th:classappend="${#fields.hasErrors('episodeIds')} ? 'has-error'">
            <label for="episodeIds">Episodes (selecciona al menos uno)</label>
            <select id="episodeIds" class="form-control" multiple="multiple" size="6" th:field="*{episodeIds}">
                <option th:each="ep : ${episodes}" th:value="${ep.id}" th:text="${ep.name}"></option>
            </select>
            <span class="help-block" th:if="${#fields.hasErrors('episodeIds')}" th:errors="*{episodeIds}"></span>
        </div>

        <button type="submit" class="btn btn-success">Save</button>
        <a href="/characters" class="btn btn-default">Cancel</a>
    </form>
</div>
</body>
</html>
