<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rick & Morty App - Total Episodes</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap-theme.min.css"
          integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-inverse">
    <div class="container">
        <a class="navbar-brand" href="/">Rick & Morty</a>
        <ul class="nav navbar-nav">
            <li><a href="/characters">Characters</a></li>
            <li class="active"><a href="/episodes">Episodes</a></li>
            <li><a href="/locations">Locations</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="jumbotron text-center">
        <h1>Total de Episodios</h1>
        <p class="lead">El número total de episodios registrados en la base de datos es:</p>
        <div class="well style-count" style="display: inline-block; padding: 20px 50px;">
            <span style="font-size: 48px; font-weight: bold; color: #337ab7;" th:text="${totalEpisodes}">0</span>
        </div>
        <p style="margin-top: 20px;">
            <a class="btn btn-primary" href="/episodes" role="button">Volver a la lista de episodios</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"
        integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
        crossorigin="anonymous"></script>
</body>
</html>
